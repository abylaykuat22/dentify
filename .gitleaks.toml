# gitleaks для apps/dentify (T-PLT-15, PLT-06): правила по умолчанию плюс исключения ниже.
# Запуск — ./verify.ps1 -Scan (bash: ./verify.sh --scan) из папки apps/dentify.
#   - История git этой папки (gitleaks git) — этим конфигом, строгим: здесь нет исключений путей. Всё, что попало в
#     коммит, проверяется целиком, в том числе .env, по ошибке закоммиченный в любую папку.
#   - Рабочая копия (gitleaks dir) — .gitleaks-dir.toml: он наследует этот конфиг ([extend] path) и исключает только
#     то, чего нет в git: зависимости, сборки, отчёты, базу GeoIP и локальные пароли машины (deploy/.env).
# Ложное срабатывание — точечно: отпечаток находки (Fingerprint из отчёта) в .gitleaksignore рядом или правило
# [[allowlists]] ниже (действует на оба скана), всегда с причиной. Настоящий секрет — отозвать и заменить, а не прятать.

[extend]
useDefault = true
