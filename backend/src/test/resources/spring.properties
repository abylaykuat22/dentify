# Spring TestContext: не «ставить на паузу» закэшированные контексты при переключении между тестовыми
# классами. Пауза гасит встроенный Tomcat (graceful shutdown), и на Windows его Acceptor пишет в лог
# ERROR «Socket accept failed». Контейнеры — синглтоны, лишний простаивающий контекст дёшев.
spring.test.context.cache.pause=never
