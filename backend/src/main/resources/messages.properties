# Тексты бэкенда на русском — базовый словарь MessageSource (dentify R003, PLT-11).
# Базовый файл, а не messages_ru: без messages.properties Spring Boot не создаёт MessageSource. Казахский —
# messages_kk.properties с теми же ключами (PLT-34); нет ключа в kk — берётся русский отсюда.
# Кодировка UTF-8 (spring.messages.encoding). Тексты с аргументами {0} идут через MessageFormat: апостроф — ''.
# Код ошибки в ProblemDetail = ключ здесь; коды модулей начинаются с модуля: patient.iin.checksum.

