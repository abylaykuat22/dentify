# --- Bean Validation: стандартные ограничения Jakarta ---
# Ключ — шаблон сообщения ограничения по умолчанию; Spring Boot ищет его здесь на языке запроса.
# Плейсхолдеры {min}, {max}, {value}, {integer}, {fraction} подставляет Hibernate Validator. В ответе код поля —
# validation.<имя-аннотации>: validation.not-blank, validation.size. Своё сообщение ограничения —
# message = "{модуль.поле.что}": тогда код поля равен этому ключу.
jakarta.validation.constraints.AssertFalse.message=Значение должно быть «нет».
jakarta.validation.constraints.AssertTrue.message=Значение должно быть «да».
jakarta.validation.constraints.DecimalMax.message=Значение не должно быть больше {value}.
jakarta.validation.constraints.DecimalMin.message=Значение не должно быть меньше {value}.
jakarta.validation.constraints.Digits.message=Не больше {integer} цифр до запятой и {fraction} после.
jakarta.validation.constraints.Email.message=Неверный адрес электронной почты.
jakarta.validation.constraints.Future.message=Дата должна быть в будущем.
jakarta.validation.constraints.FutureOrPresent.message=Дата не может быть в прошлом.
jakarta.validation.constraints.Max.message=Значение не должно быть больше {value}.
jakarta.validation.constraints.Min.message=Значение не должно быть меньше {value}.
jakarta.validation.constraints.Negative.message=Значение должно быть меньше нуля.
jakarta.validation.constraints.NegativeOrZero.message=Значение не должно быть больше нуля.
jakarta.validation.constraints.NotBlank.message=Заполните поле.
jakarta.validation.constraints.NotEmpty.message=Заполните поле.
jakarta.validation.constraints.NotNull.message=Заполните поле.
jakarta.validation.constraints.Null.message=Поле должно быть пустым.
jakarta.validation.constraints.Past.message=Дата должна быть в прошлом.
jakarta.validation.constraints.PastOrPresent.message=Дата не может быть в будущем.
jakarta.validation.constraints.Pattern.message=Неверный формат.
jakarta.validation.constraints.Positive.message=Значение должно быть больше нуля.
jakarta.validation.constraints.PositiveOrZero.message=Значение не может быть отрицательным.
jakarta.validation.constraints.Size.message=Допустимая длина — от {min} до {max}.
